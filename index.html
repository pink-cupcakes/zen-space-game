<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080f17">
<title>Drift — a quiet journey</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="scene" aria-label="A quiet journey through space">
  <div class="art"></div><canvas id="stars" aria-hidden="true"></canvas><div class="shade"></div>
  <header class="top"><div class="brand"><span class="mark">✳</span><span>DRIFT <small> / &nbsp; A QUIET JOURNEY</small></span></div><div class="status"><i></i> ALL SYSTEMS CALM</div></header>
  <section class="intro"><p class="eyebrow">SOMEWHERE BETWEEN HERE AND THERE</p><h1>Take the long way.</h1><p>No destination. No rush. Just you and the quiet<br class="desktop"> hum of a ship moving through the dark.</p><button id="begin" class="begin">SETTLE IN <span>↗</span></button></section>
  <div class="readout"><span>VESSEL STATUS</span><strong>Coasting</strong><div class="line"></div><span>THE JOURNEY</span><strong id="distance">000.00 <small>LY</small></strong></div>
  <footer class="controls"><div class="control-label"><span class="dot"></span><div><b>YOUR LITTLE CORNER OF SPACE</b><small>Make yourself comfortable.</small></div></div><div class="actions"><label class="ship-control" for="ship"><small>YOUR SHIP</small><select id="ship"><option value="night-watch">Night watch</option><option value="amber-voyager">Amber voyager</option></select></label><button id="speed" title="Change travel speed"><span>◌</span><div><small>TRAVEL PACE</small><b>Slow drift</b></div></button><button id="sound" title="Toggle ambient ship hum"><span>♫</span><div><small>SHIP HUM</small><b>Off</b></div></button><button id="hide" title="Hide controls"><span>⌁</span><div><small>VIEW</small><b>Clear window</b></div></button></div></footer>
  <button class="restore" id="restore">✳ &nbsp; SHOW CONTROLS</button>
</main><script src="app.js"></script>
</body></html>
